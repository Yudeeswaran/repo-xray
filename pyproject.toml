[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-xray"
version = "1.0.3"
description = "Evidence-grounded repository X-Ray and requirement mutation"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Repo X-Ray contributors"}]
dependencies = []

[project.scripts]
repo-xray = "skills.xray.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["skills*"]

[tool.setuptools.package-data]
"skills.xray" = ["*.json", "*.md", "schemas/*.json"]
